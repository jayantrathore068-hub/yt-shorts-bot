name: Render Short Video

on:
  repository_dispatch:
    types: [make_video]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install FFmpeg and Python Libraries
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install edge-tts moviepy==1.0.3 requests Pillow==9.5.0 numpy

      - name: Generate Video and Send to Make.com
        env:
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: python main.py
